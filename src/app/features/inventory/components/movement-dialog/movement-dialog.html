<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" aria-hidden="true" (click)="closed.emit()"></div>

  <form
    role="dialog"
    aria-modal="true"
    aria-labelledby="movement-title"
    [formGroup]="form"
    (ngSubmit)="save()"
    class="card platon-modal relative flex w-full max-w-[520px] flex-col gap-5 bg-white"
  >
    <header class="flex flex-col gap-1 pr-10"><button type="button" aria-label="Cerrar movimiento" [disabled]="saving()" (click)="closed.emit()" class="absolute right-5 top-5 grid size-8 place-items-center rounded-full bg-surface-muted text-xl text-ink-muted">×</button>
      <h2 id="movement-title" class="card-title">Registrar movimiento</h2>
      <p class="pl-[5px] text-sm font-medium text-muted">
        {{ item().name }} · Stock actual: {{ item().stock }}
      </p>
    </header>

    <div class="flex flex-col gap-2.5">
      <label for="movement-type" class="form-label">Tipo de movimiento</label>
      <div class="relative">
        <select
          id="movement-type"
          formControlName="type"
          class="form-control appearance-none pr-12"
        >
          <option value="ENTRY">Ingreso</option>
          <option value="EXIT">Salida</option>
        </select>
        <app-icon
          name="down"
          [size]="10"
          class="pointer-events-none absolute right-5 top-1/2 -translate-y-1/2 text-muted"
        ></app-icon>
      </div>
    </div>

    <div class="flex flex-col gap-2.5">
      <label for="movement-quantity" class="form-label">
        Cantidad <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <input
        id="movement-quantity"
        type="number"
        formControlName="quantity"
        required
        min="1"
        step="1"
        inputmode="numeric"
        class="form-control [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      />
      @if (exceedsStock()) {
      <p role="alert" class="pl-[5px] text-sm font-medium text-danger">
        La salida no puede superar el stock actual ({{ item().stock }}).
      </p>
      }
    </div>

    <div class="flex flex-col gap-2.5">
      <label for="movement-notes" class="form-label">Notas</label>
      <textarea
        id="movement-notes"
        formControlName="notes"
        maxlength="500"
        placeholder="Ej. Reposición de proveedor"
        class="form-control h-[100px] resize-none"
      ></textarea>
      <p class="pr-[5px] text-right text-xs font-medium text-muted">
        {{ form.controls.notes.value.length }}/500
      </p>
    </div>

    @if (error(); as message) {
    <p role="alert" class="text-sm font-medium text-danger">{{ message }}</p>
    }

    <div class="dialog-actions flex justify-end gap-3 border-t border-border pt-5">
      <button
        type="button"
        (click)="closed.emit()"
        class="btn border-2 border-[#e2e8f0] text-[#66656A] hover:bg-muted/10"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="form.invalid || exceedsStock() || saving()"
        class="btn border-2 border-[#BFE8FF] bg-brand text-white hover:bg-brand/90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ saving() ? 'Guardando...' : 'Registrar' }}
      </button>
    </div>
  </form>
</div>
