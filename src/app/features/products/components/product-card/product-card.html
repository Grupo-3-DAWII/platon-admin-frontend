<article
  class="flex w-[271px] flex-col gap-[2px] rounded-[20px] border-[2px] border-pc-border p-[15px] shadow-[var(--pc-shadow)]"
>
  <header>
    <div class="flex h-[40px] justify-between">
      <div class="*:h-[20px]">
        <h2 class="text-[14px] font-bold">{{ book().title }}</h2>
        <p class="text-[10px] font-medium text-pc-grey">{{ book().author }}</p>
      </div>
      <button
        type="button"
        aria-label="Más opciones"
        class="flex size-[28px] items-center rounded-full border-[1px] border-pc-border p-[5px]"
      >
        <app-icon name="more-horizontal" [size]="18" />
      </button>
    </div>
    <app-badge [variant]="badge().variant">{{ badge().label }}</app-badge>
  </header>

  <div class="h-[173px]">
    <img
      class="m-auto h-full object-contain"
      [src]="book().coverUrl"
      [alt]="'Portada de ' + book().title"
    />
  </div>

  <div class="flex justify-between">
    <span class="self-center text-[12px] text-pc-grey">{{ book().category }}</span>
    <div class="flex flex-col items-end">
      @if (book().discountPrice) {
      <del class="text-[12px] text-pc-grey">{{ book().price | currency: 'PEN' : 'S/ ' }}</del>
      <ins class="text-[18px] font-black no-underline">
        {{ book().discountPrice | currency: 'PEN' : 'S/ ' }}
      </ins>
      } @else {
      <span class="text-[18px] font-black">{{ book().price | currency: 'PEN' : 'S/ ' }}</span>
      }
    </div>
  </div>
</article>
