<article
  class="flex h-full flex-col gap-[2px] rounded-[20px] border-[2px] border-pc-border p-[15px] shadow-[var(--pc-shadow)]"
>
  <header>
    <div class="flex h-[40px] justify-between gap-2">
      <div class="min-w-0 *:h-[20px]">
        <h2 class="truncate text-[13px] font-bold" [title]="book().title">{{ book().title }}</h2>
        <p class="truncate text-[11px] font-medium text-pc-grey" [title]="book().author">
          {{ book().author }}
        </p>
      </div>
      <a
        [routerLink]="['/products', book().id, 'edit']"
        aria-label="Editar producto"
        class="flex size-[28px] shrink-0 items-center rounded-full border-[1px] border-pc-border p-[5px]"
      >
        <app-icon name="more-horizontal" [size]="18" />
      </a>
    </div>
    <app-badge [variant]="badge().variant">{{ badge().label }}</app-badge>
  </header>

  <div class="h-[173px]">
    <img
      class="m-auto h-full object-contain"
      [src]="book().coverUrl"
      [alt]="'Portada de ' + book().title"
    />
  </div>

  <div class="mt-auto flex justify-between">
    <span class="self-end text-[12px] text-pc-grey">{{ genre() }}</span>
    <div class="flex flex-col items-end">
      @if (book().discountPrice) {
      <del class="text-[12px] text-pc-grey">{{ book().salePrice | currency: 'PEN' : 'S/ ' }}</del>
      <ins class="text-[18px] font-black no-underline">
        {{ book().discountPrice | currency: 'PEN' : 'S/ ' }}
      </ins>
      } @else {
      <span class="text-[18px] font-black">{{ book().salePrice | currency: 'PEN' : 'S/ ' }}</span>
      }
    </div>
  </div>
</article>
