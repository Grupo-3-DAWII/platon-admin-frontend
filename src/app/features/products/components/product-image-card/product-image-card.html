<section class="card flex flex-col gap-5" aria-labelledby="image-title">
  <h2 id="image-title" class="card-title">Imagen del producto</h2>

  <div
    class="flex h-[212px] items-center justify-center rounded-[30px] border-2 border-neutral-300 px-5 py-2.5"
  >
    <img
      [src]="src() || placeholder"
      alt="Portada del libro"
      class="h-full w-auto object-contain"
    />
  </div>

  @if (!disabled()) {
  <div class="flex flex-col gap-2.5">
    <label for="image" class="pl-1 text-sm font-bold text-muted">URL de la imagen</label>
    <input
      id="image"
      type="url"
      placeholder="https://ejemplo.com/portada.jpg"
      [value]="src() === placeholder ? '' : (src() ?? '')"
      (input)="onUrlInput($event)"
      class="form-control"
    />
    @if (invalid()) {
    <p role="alert" class="pl-1 text-sm font-medium text-danger">
      Ingresa una URL que empiece con http:// o https://
    </p>
    }
  </div>
  }
  <ng-content />
</section>
