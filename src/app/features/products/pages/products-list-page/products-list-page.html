<div class="flex flex-col gap-[20px]">
  <app-page-header title="Productos">
    <a
      routerLink="/products/new"
      class="flex gap-[15px] rounded-[30px] bg-brand px-[16px] py-[12px] text-white"
    >
      <app-icon name="add" [size]="16"></app-icon>
      <span class="text-[14px] font-medium">Nuevo producto</span>
    </a>
  </app-page-header>

  <app-filters-bar
    searchPlaceholder="Buscar productos"
    [filters]="filters"
    [selectedFilter]="selectedFilter()"
    [totalCount]="totalElements()"
    (filterChange)="onFilterChange($event)"
    (searchChange)="onSearch($event)"
    (filterClick)="openFilterPanel()"
    (sortClick)="openSortMenu()"
  />

  @if (error()) {
  <div class="py-10 text-center text-pc-grey">
    <p>No se pudieron cargar los productos.</p>
    <button type="button" class="mt-3 font-medium text-brand underline" (click)="retry()">
      Reintentar
    </button>
  </div>
  } @else if (loading()) {
  <p class="py-10 text-center text-pc-grey">Cargando productos...</p>
  } @else {
  <div class="grid grid-cols-4 gap-[24px]">
    @for (book of filteredProducts(); track book.id) {
    <app-product-card [book]="book" />
    } @empty {
    <p class="col-span-4 py-10 text-center text-pc-grey">No hay productos para mostrar.</p>
    }
  </div>
  } @if (totalElements() > 0) {
  <app-pagination
    [page]="page()"
    [pageSize]="pageSize()"
    [totalItems]="totalElements()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
  }
</div>
