<div class="flex min-h-full flex-col gap-[20px]">
  <app-page-header title="Ventas" subtitle="Consulta las ventas realizadas y el estado de pago" />

  <app-filters-bar
    searchPlaceholder="Buscar por venta, pedido o cliente..."
    [filters]="filters"
    [selectedFilter]="query.filter()"
    [totalCount]="totalCount()"
    (filterChange)="query.setFilter($event)"
    (searchChange)="query.setSearch($event)"
    (filterClick)="openFilterPanel()"
    (sortClick)="openSortMenu()"
  />

  <app-data-table [columns]="columns">
    @for (sale of pagedSales(); track sale.id) {
    <tr class="h-[56px] transition-colors hover:bg-table-row-hover">
      <td class="border-b border-table-divider px-5 py-2 text-base font-medium text-ink">
        {{ sale.id }}
      </td>

      <td class="border-b border-table-divider px-5 py-2">
        <a
          routerLink="/orders"
          class="inline-flex items-center gap-2.5 text-base font-semibold text-ink-muted transition-colors hover:text-ink"
        >
          {{ sale.orderCode }}
          <app-icon name="foreign" [size]="12" />
        </a>
      </td>

      <td class="border-b border-table-divider px-5 py-2 text-base font-medium text-ink-muted">
        {{ sale.orderCode }}
        <app-icon name="foreign" [size]="12"></app-icon>
      </td>

      <td class="border-b border-table-divider px-5 py-2 text-base text-ink">
        {{ sale.customerName }}
      </td>

      <td class="border-b border-table-divider px-5 py-2 text-base text-ink">
        {{ sale.createdAt | date: 'dd-MM-yyyy' }}
      </td>
      <td class="border-b border-table-divider px-5 py-2 text-base text-ink">
        {{ sale.total | currency: 'PEN' : 'S/ ' }}
      </td>

      <td class="border-b border-table-divider px-5 py-2">
        <app-payment-status-badge [status]="sale.paymentStatus" />
      </td>

      <td class="border-b border-table-divider px-5 py-2">
        <app-order-status-badge [status]="sale.status" />
      </td>

      <td class="border-b border-table-divider px-5 py-2 text-center">
        <button
          type="button"
          [attr.aria-label]="'Opciones de la venta ' + sale.code"
          class="inline-flex size-8 items-center justify-center rounded-full border border-border text-ink-muted transition-colors hover:bg-surface-muted hover:text-ink"
        >
          <app-icon name="more" [size]="12" />
        </button>
      </td>
    </tr>
    } @empty {
    <tr>
      <td colspan="9" class="py-10 text-center text-pc-grey">No hay ventas para mostrar.</td>
    </tr>
    }
  </app-data-table>

  <div class="mt-auto">
    <app-pagination
      [page]="query.page()"
      [pageSize]="query.pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      [totalItems]="filteredSales().length"
      (pageChange)="query.setPage($event)"
      (pageSizeChange)="query.setPageSize($event)"
    />
  </div>
</div>
