<header
  class="flex items-center gap-[15px] border-b border-border bg-surface px-7 py-[15px]"
>
  <!-- Main -->
  <div class="flex flex-1 items-center justify-between">
    <!-- Search -->
    <div class="w-[359px]">
      <app-search-input placeholder="Buscar" />
    </div>

    <!-- Actions -->
    <div class="flex flex-1 items-center justify-end gap-5">
      <!-- Notification -->
      <div class="relative inline-flex items-center justify-center text-ink-muted">
        <app-icon
          name="notification"
          [size]="20"
        />

        <!-- Badge -->
        <span
          class="absolute -right-0.5 -top-0.5 size-2.5 rounded-full bg-danger"
          aria-hidden="true"
        ></span>
      </div>

      <!-- Divider -->
      <div
        class="h-5 w-px bg-border"
        aria-hidden="true"
      ></div>

      <!-- Profile -->
      <div class="flex items-center gap-3">
        <!-- Avatar -->
        <img
          src="/images/avatar/user-avatar.png"
          alt="Jhaser Campos"
          class="size-8 rounded-full object-cover"
        />

        <!-- Info -->
        <div class="flex flex-col justify-center">
          <span class="text-sm font-medium leading-none text-ink">
            Jhaser Campos
          </span>

          <span class="mt-1 text-[10px] leading-none text-ink-soft">
            Admin
          </span>
        </div>

        <!-- Menu -->
        <button
          type="button"
          aria-label="Abrir menú de perfil"
          class="flex size-8 items-center justify-center text-ink-muted transition-colors hover:text-ink"
        >
          <app-icon
            name="more"
            [size]="18"
          />
        </button>
      </div>
    </div>
  </div>
</header>
