<aside #sidebar id="main-navigation" [attr.role]="isMobile() ? 'dialog' : null" aria-label="Navegación principal"
  [attr.aria-modal]="isMobile() && mobileOpen() ? 'true' : null"
  [attr.inert]="isMobile() && !mobileOpen() ? '' : null" [attr.aria-hidden]="isMobile() && !mobileOpen() ? 'true' : null"
  [class.-translate-x-full]="!mobileOpen()" [class.translate-x-0]="mobileOpen()" (keydown)="trapFocus($event)" tabindex="-1"
  class="fixed inset-y-0 left-0 z-50 flex h-dvh w-[min(300px,85vw)] shrink-0 flex-col overflow-y-auto overscroll-contain border-r border-border bg-sidebar-bg p-5 shadow-xl transition-transform duration-200 motion-reduce:transition-none lg:static lg:w-[300px] lg:translate-x-0 lg:p-6 lg:shadow-none">
  <div class="mb-6 flex items-center justify-between gap-3">
    <img
      src="/images/logo/platon-logo.png"
      alt="Librería Platón"
      class="h-9 w-auto object-contain"
    />
    <button #closeButton type="button" aria-label="Cerrar menú lateral" (click)="navigation.emit()"
      class="flex size-10 shrink-0 items-center justify-center rounded-full text-2xl text-ink-muted hover:bg-surface-muted lg:hidden">×</button>
  </div>

  <nav class="flex flex-1 flex-col lg:min-h-0">
    <div class="space-y-2">
      @for (item of visibleItems(); track item.route) {
        <a
          [routerLink]="item.route" (click)="navigation.emit()"
          routerLinkActive="!bg-sidebar-active-bg !text-sidebar-active-text"
          class="flex items-center gap-3 rounded-full px-4 py-3 text-sm font-medium text-sidebar-text transition-colors hover:bg-sidebar-hover"
        >
          <app-icon
            [name]="item.icon"
            [size]="20"
          />

          <span>
            {{ item.label }}
          </span>
        </a>
      }
    </div>

    <div class="mt-auto space-y-2 pt-6">
      @for (item of secondaryItems; track item.route) {
        <a
          [routerLink]="item.route" (click)="navigation.emit()"
          routerLinkActive="!bg-sidebar-active-bg !text-sidebar-active-text"
          class="flex items-center gap-3 rounded-full px-4 py-3 text-sm font-medium text-sidebar-text transition-colors hover:bg-sidebar-hover"
        >
          <app-icon
            [name]="item.icon"
            [size]="20"
          />

          <span>
            {{ item.label }}
          </span>
        </a>
      }

      <button
        type="button"
        class="flex w-full items-center gap-3 rounded-full px-4 py-3 text-sm font-medium text-sidebar-text transition-colors hover:bg-danger-soft hover:text-danger"
        (click)="logout()"
      >
        <app-icon
          name="logout"
          [size]="20"
        />

        <span>
          Cerrar sesión
        </span>
      </button>
    </div>
  </nav>
</aside>

<dialog #logoutDialog aria-labelledby="logout-title" class="m-auto w-[min(94vw,420px)] rounded-3xl border border-border bg-white p-5 text-ink shadow-xl backdrop:bg-black/40 sm:p-7">
  <h2 id="logout-title" class="text-xl font-semibold">¿Cerrar sesión?</h2>
  <p class="mt-3 text-sm text-ink-muted">Tendrás que iniciar sesión nuevamente para volver al sistema.</p>
  <div class="dialog-actions mt-6 flex flex-wrap justify-end gap-3">
    <button type="button" (click)="cancelLogout()" class="rounded-full border border-border px-5 py-2.5 text-sm font-medium">Cancelar</button>
    <button type="button" (click)="confirmLogout()" class="rounded-full bg-brand px-5 py-2.5 text-sm font-semibold text-white">Cerrar sesión</button>
  </div>
</dialog>
