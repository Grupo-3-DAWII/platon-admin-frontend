<div class="flex flex-col gap-2">
  @if (label()) {
    <label
      [for]="id()"
      class="text-sm font-medium text-ink"
    >
      {{ label() }}
    </label>
  }

  <div
    class="flex h-11 w-full items-center gap-3 rounded-full border border-control-border bg-control-bg px-4 transition focus-within:border-brand focus-within:ring-2 focus-within:ring-brand/10"
    [class.border-danger]="error()"
    [class.cursor-not-allowed]="disabled()"
    [class.bg-surface-muted]="disabled()"
    [class.opacity-60]="disabled()"
  >
    @if (leftIcon()) {
      <span
        class="flex shrink-0 items-center justify-center text-ink-muted"
      >
        <app-icon
          [name]="leftIcon()!"
          [size]="18"
        />
      </span>
    }

    <input
      [id]="id()"
      [name]="id()"
      [type]="resolvedType()"
      [placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="error() ? 'true' : null"
      (input)="onInput($event)"
      class="min-w-0 flex-1 bg-transparent text-sm font-normal text-ink outline-none placeholder:text-control-placeholder disabled:cursor-not-allowed"
    />

    @if (type() === 'password' && showPasswordToggle()) {
      <button
        type="button"
        class="flex shrink-0 items-center justify-center text-ink-muted transition-colors hover:text-ink"
        [attr.aria-label]="
          passwordVisible()
            ? 'Ocultar contraseña'
            : 'Mostrar contraseña'
        "
        (click)="togglePasswordVisibility()"
      >
        <app-icon
          [name]="passwordIcon()"
          [size]="18"
        />
      </button>
    }
  </div>

  @if (error()) {
    <span class="text-xs font-normal text-danger">
      {{ error() }}
    </span>
  }
</div>
