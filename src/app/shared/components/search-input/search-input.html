<div
  class="flex w-full items-center gap-[15px] rounded-full border border-border bg-surface px-5 py-2.5 shadow-[0_1px_3px_rgba(32,40,39,0.025)]"
>
  <app-icon name="search" class="shrink-0" [size]="20" />

  <input
    type="search"
    [placeholder]="placeholder()"
    [attr.aria-label]="label() || placeholder()"
    [value]="value()"
    [class]="clearable() ? '[&::-webkit-search-cancel-button]:appearance-none' : ''"
    (input)="onInput($event)"
    class="min-w-0 flex-1 bg-transparent text-sm font-normal text-ink outline-none placeholder:text-ink-muted"
  />
  @if (clearable() && value()) {
  <button
    type="button"
    aria-label="Limpiar búsqueda"
    (click)="valueChange.emit('')"
    class="flex size-5 shrink-0 items-center justify-center rounded-full text-lg leading-none text-ink-muted hover:text-brand"
  >
    ×
  </button>
  }
</div>
